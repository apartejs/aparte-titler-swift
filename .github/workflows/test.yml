name: test
on: [push, pull_request]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests
        run: swift test -c release
      - name: Tests on the iPhone simulator
        run: |
          # the newest iPhone simulator installed on the runner, whatever its name
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in runtimes if ".iOS-" in k), key=lambda k: [int(p) for p in k.split("iOS-")[1].split("-")])
          print(next(d["udid"] for k in reversed(ios) for d in runtimes[k] if d["name"].startswith("iPhone")))')
          xcrun simctl list devices | grep "$udid"
          xcodebuild test -scheme AparteTitler-Package -configuration Release -destination "id=$udid" 2>&1 \
            | grep -E "Test Case|Executed|error|failed|SUCCEEDED|FAILED"
          test ${PIPESTATUS[0]} -eq 0
      - name: Build for watchOS
        run: xcodebuild build -scheme AparteTitler-Package -destination 'generic/platform=watchOS Simulator' -quiet
      - name: Build for tvOS
        run: xcodebuild build -scheme AparteTitler-Package -destination 'generic/platform=tvOS Simulator' -quiet
      - name: Build for visionOS
        run: xcodebuild build -scheme AparteTitler-Package -destination 'generic/platform=visionOS Simulator' -quiet

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests
        run: swift test -c release
